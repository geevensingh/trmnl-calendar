# Disposable hosted fixture. Never merge or use this check as required Full evidence.
name: Node portability diagnostic (not Full validation)

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-portability-diagnostic:
    # Metadata skips must neither satisfy the required check nor cancel validation.
    name: >-
      ${{ (github.event_name != 'pull_request' || github.event.action != 'edited' ||
      github.event.changes.base.ref.from != '') && 'Node portability diagnostic (not Full validation)' || 'Node probe metadata only (not validation)' }}
    if: >-
      github.event_name != 'pull_request' || github.event.action != 'edited' ||
      github.event.changes.base.ref.from != ''
    concurrency:
      group: >-
        ${{ (github.event_name == 'pull_request' && github.event.action == 'edited' &&
        github.event.changes.base.ref.from == '') && format('node-portability-diagnostic-metadata-{0}', github.run_id) ||
        format('node-portability-diagnostic-{0}', github.event.pull_request.number || github.ref) }}
      cancel-in-progress: true
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AZURE_BICEP_CHECK_VERSION: 'false'
    steps:
      - name: Check out the event-pinned head or dispatch revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare and verify the event-pinned PR merge
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
          PR_BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: node .\scripts\prepare-ci.mjs --head-commit "$env:PR_HEAD_COMMIT" --base-commit "$env:PR_BASE_COMMIT"

      - name: Set up the selected .NET SDK and host runtime
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Set up Ruby with Devkit and locked Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler: Gemfile.lock
          bundler-cache: false

      - name: Provision local Functions and Bicep tools
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global azure-functions-core-tools@4
          if ($LASTEXITCODE -ne 0) { throw 'Functions Core Tools v4 installation failed.' }
          func --version
          if ($LASTEXITCODE -ne 0) { throw 'Functions Core Tools could not start.' }
          az version
          if ($LASTEXITCODE -ne 0) { throw 'Azure CLI is required on the Windows runner.' }
          az bicep install
          if ($LASTEXITCODE -ne 0) { throw 'Local Bicep compiler installation failed.' }
          az bicep version
          if ($LASTEXITCODE -ne 0) { throw 'Local Bicep compiler is unavailable.' }

      - name: Restore locked display dependencies and pinned Chromium
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\setup-display.ps1

      - name: Record native temporary directory and evaluated source
        run: |
          $ErrorActionPreference = 'Stop'
          $evidence = Join-Path $env:RUNNER_TEMP 'node-portability-evidence'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          node --input-type=module -e 'import { tmpdir } from "node:os"; import { realpathSync } from "node:fs"; console.log(JSON.stringify({ tmpdir: tmpdir(), realpath: realpathSync(tmpdir()) }, null, 2));' |
            Tee-Object -FilePath (Join-Path $evidence 'native-temp.json')
          if ($LASTEXITCODE -ne 0) { throw 'Native temporary directory diagnostic failed.' }
          $evaluated = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve evaluated commit.' }
          git diff --exit-code 2192d0f7edd96b961c27ef7fa743ba30540c35a3 HEAD -- scripts tests
          if ($LASTEXITCODE -ne 0) { throw 'Scripts or tests differ from the reviewed candidate.' }
          @{
            reviewed_source = '2192d0f7edd96b961c27ef7fa743ba30540c35a3'
            head_commit = '${{ github.event.pull_request.head.sha || github.sha }}'
            base_commit = '${{ github.event.pull_request.base.sha }}'
            evaluated_commit = "$evaluated"
            scripts_and_tests_identical = $true
          } | ConvertTo-Json | Tee-Object -FilePath (Join-Path $evidence 'source.json')

      - name: Run authoritative Fast validation including required build
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\validate.ps1 -Scope Fast 2>&1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'node-portability-evidence\fast.log')
          if ($LASTEXITCODE -ne 0) { throw "Fast validation exited with code $LASTEXITCODE." }

      - name: Run the entire shared Full Node file selection only
        run: |
          $ErrorActionPreference = 'Stop'
          $root = (Get-Location).Path
          $files = @(foreach ($directory in @('tests\delivery', 'tests\validation')) {
            $tests = @(Get-ChildItem -LiteralPath (Join-Path $root $directory) -Filter '*.test.mjs' -File |
              Sort-Object Name)
            if ($tests.Count -eq 0) { throw "No Node tests found in $directory; refusing an empty test run." }
            $tests.FullName
          })
          $evidence = Join-Path $env:RUNNER_TEMP 'node-portability-evidence'
          $files | Set-Content -LiteralPath (Join-Path $evidence 'node-files.txt')
          $arguments = @('--test') + $files
          node @arguments 2>&1 | Tee-Object -FilePath (Join-Path $evidence 'node.log')
          $nodeExitCode = $LASTEXITCODE
          @{ exit_code = $nodeExitCode; file_count = $files.Count } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence 'node-exit.json')
          if ($nodeExitCode -ne 0) { throw "Node tests exited with code $nodeExitCode." }

      - name: Preserve disposable diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-portability-diagnostic-${{ github.run_id }}
          path: ${{ runner.temp }}\node-portability-evidence
          if-no-files-found: error
