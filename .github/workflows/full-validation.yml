name: Full validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full validation
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AZURE_BICEP_CHECK_VERSION: 'false'
    steps:
      - name: Check out the evaluated PR revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up the selected .NET SDK and host runtime
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Set up Ruby with Devkit and locked Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler: Gemfile.lock
          bundler-cache: false

      - name: Provision local Functions and Bicep tools
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --global azure-functions-core-tools@4
          if ($LASTEXITCODE -ne 0) { throw 'Functions Core Tools v4 installation failed.' }
          func --version
          if ($LASTEXITCODE -ne 0) { throw 'Functions Core Tools could not start.' }
          az version
          if ($LASTEXITCODE -ne 0) { throw 'Azure CLI is required on the Windows runner.' }
          az bicep install
          if ($LASTEXITCODE -ne 0) { throw 'Local Bicep compiler installation failed.' }
          az bicep version
          if ($LASTEXITCODE -ne 0) { throw 'Local Bicep compiler is unavailable.' }

      - name: Restore locked display dependencies and pinned Chromium
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\setup-display.ps1

      - name: Disposable CI acceptance probe - remove one generated prerequisite (do not merge)
        run: |
          $ErrorActionPreference = 'Stop'
          $asset = '.tools\framework\js\3.4.3\plugins.js'
          if (!(Test-Path -LiteralPath $asset -PathType Leaf)) {
            throw 'Probe requires the normally provisioned pinned framework asset.'
          }
          Remove-Item -LiteralPath $asset
          Write-Host 'Acceptance probe removed only the generated runner-local plugins.js asset.'

      - name: Run the shared Full validation
        run: pwsh -NoLogo -NoProfile -NonInteractive -File .\scripts\validate.ps1 -Scope Full
